<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebXR 检测</title>
</head>
<body style="font-family:sans-serif;padding:20px;font-size:18px;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
<h1>WebXR 能力检测</h1>
<div id="result" style="margin:20px 0;padding:20px;background:#16213e;border-radius:10px;min-width:280px">检测中...</div>
<a href="./" style="margin-top:20px;color:#4fc3f7">返回 AR 页面</a>
<script>
async function check(){
  const r=document.getElementById("result");
  if(!navigator.xr){
    r.innerHTML="<b>❌ 浏览器不支持 WebXR</b><br><br>请使用 Chrome 或 Edge 浏览器";
    return
  }
  const ar=await navigator.xr.isSessionSupported("immersive-ar");
  const vr=await navigator.xr.isSessionSupported("immersive-vr");
  const inline=await navigator.xr.isSessionSupported("inline");
  r.innerHTML=
    "<b>检测结果:</b><br><br>"+
    "WebXR API: ✅<br><br>"+
    "immersive-ar (AR空间定位): "+(ar?"<b style='color:#4caf50'>✅ 支持</b>":"<b style='color:#f44336'>❌ 不支持</b>")+"<br><br>"+
    "immersive-vr (VR): "+(vr?"✅ 支持":"❌ 不支持")+"<br><br>"+
    "inline (基础): "+(inline?"✅ 支持":"❌ 不支持")+"<br><br>"+
    (ar?"<b style='color:#4caf50'>你的手机支持 AR 空间定位！</b>":"<b style='color:#ff9800'>需要用陀螺仪方案替代</b>")
}
check()
</script>
</body>
</html>
